name: Daily Football Predictions

on:
  schedule:
    # 06:00 UTC: publish morning pre-match predictions
    - cron: '0 6 * * *'
    # 22:30 UTC: refresh after the day's matches (adds new results to the ratings)
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs push or deploy at the same time.
concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  run-daily-model:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run model unit tests
        run: pytest -v model/tests

      # Historical CSVs are not committed (football-data.co.uk restricts redistribution).
      # They are kept in the Actions cache between runs instead.
      - name: Restore historical CSV cache
        uses: actions/cache@v4
        with:
          path: model/data/raw/*.csv
          key: football-data-csv-${{ github.run_id }}
          restore-keys: |
            football-data-csv-

      - name: Run daily prediction pipeline
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_REGION: ${{ vars.ODDS_REGION || 'uk' }}
          ODDS_MIN_CREDITS_REMAINING: ${{ vars.ODDS_MIN_CREDITS_REMAINING || '10' }}
          # Off unless the repository variable is set to 'true' after accepting
          # football-data.co.uk's terms. When on, missing seasons download once and the
          # current season refreshes at most twice weekly (their fair-use limit).
          ALLOW_FOOTBALL_DATA_DOWNLOADS: ${{ vars.ALLOW_FOOTBALL_DATA_DOWNLOADS || 'false' }}
        run: |
          if ! ls model/data/raw/*.csv >/dev/null 2>&1 && [ "$ALLOW_FOOTBALL_DATA_DOWNLOADS" != "true" ]; then
            echo "::error::No historical CSVs in the cache and downloads are off. Set the repository variable ALLOW_FOOTBALL_DATA_DOWNLOADS=true (Settings > Secrets and variables > Actions > Variables) once you have accepted football-data.co.uk's terms."
            exit 1
          fi
          if [ -z "$FOOTBALL_DATA_TOKEN" ] && [ -z "$API_FOOTBALL_KEY" ]; then
            echo "::error::Add a FOOTBALL_DATA_TOKEN (or API_FOOTBALL_KEY) repository secret so the job can fetch fixtures."
            exit 1
          fi
          python -m model.run_daily

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Your own dataset (predictions saved before kick-off + real results) is committed so it keeps growing.
          git add site/picks.json site/status.json site/history.json public/picks.json dataset/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(model): update daily predictions and dataset"
            git pull --rebase --autostash
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static prediction site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
