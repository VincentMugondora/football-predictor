name: Daily Football Predictions & Result Reconciliation

on:
  schedule:
    # 06:00 UTC: Publish morning pre-match predictions
    - cron: '0 6 * * *'
    # 22:30 UTC: Reconcile completed match scores against pre-match predictions
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r model/requirements.txt

      - name: Run daily prediction & post-match result comparison pipeline
        run: python -m model.run_daily

      - name: Run model unit tests
        run: pytest -v

      - name: Commit updated predictions and post-match comparisons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/picks.json site/predictions_history.json src/data/realPicks.json docs/experiments.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(model): update daily predictions and post-match result comparisons"
            git push
          fi
