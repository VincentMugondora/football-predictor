name: Daily Football Predictions & Result Reconciliation

on:
  schedule:
    # 06:00 UTC: Publish morning pre-match predictions
    - cron: '0 6 * * *'
    # 22:30 UTC: Reconcile completed match scores against pre-match predictions
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-daily-model:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r model/requirements.txt

      - name: Run daily prediction & post-match result comparison pipeline
        env:
          # Secrets are optional where the provider supports anonymous access. The model
          # never enables historical CSV downloads in CI.
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_REGION: ${{ vars.ODDS_REGION || 'uk' }}
          ODDS_MIN_CREDITS_REMAINING: ${{ vars.ODDS_MIN_CREDITS_REMAINING || '10' }}
          ALLOW_FOOTBALL_DATA_DOWNLOADS: 'false'
        run: python -m model.run_daily

      - name: Run model unit tests
        run: pytest -v

      - name: Commit updated predictions and post-match comparisons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/picks.json site/predictions_history.json src/data/realPicks.json docs/experiments.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(model): update daily predictions and post-match result comparisons"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static prediction site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
